name: Continuous integration

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Run backend tests
        run: npm test
      - name: Validate architecture assets
        run: python3 scripts/validate-architecture.py

  flutter-quality:
    name: Flutter analysis, tests, and web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/cloudprint_app
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Resolve Dart dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run widget tests
        run: flutter test
      - name: Build release web bundle
        run: flutter build web --release
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: cloudprint-web-${{ github.sha }}
          path: apps/cloudprint_app/build/web
          if-no-files-found: error
          retention-days: 14
