name: Native application builds

on:
  push:
    branches: [master]
    paths:
      - apps/cloudprint_app/**
      - .github/workflows/native-builds.yml
  pull_request:
    branches: [master]
    paths:
      - apps/cloudprint_app/**
      - .github/workflows/native-builds.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK and App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/cloudprint_app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - name: Upload Android deliverables
        uses: actions/upload-artifact@v4
        with:
          name: cloudprint-android-${{ github.sha }}
          path: |
            apps/cloudprint_app/build/app/outputs/flutter-apk/*.apk
            apps/cloudprint_app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS unsigned application
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/cloudprint_app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Upload unsigned iOS application
        uses: actions/upload-artifact@v4
        with:
          name: cloudprint-ios-unsigned-${{ github.sha }}
          path: apps/cloudprint_app/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: ${{ matrix.name }} desktop build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            runner: ubuntu-latest
            target: linux
            dependencies: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
            artifact_path: apps/cloudprint_app/build/linux/x64/release/bundle
          - name: Windows
            runner: windows-latest
            target: windows
            dependencies: ''
            artifact_path: apps/cloudprint_app/build/windows/x64/runner/Release
          - name: macOS
            runner: macos-latest
            target: macos
            dependencies: ''
            artifact_path: apps/cloudprint_app/build/macos/Build/Products/Release
    defaults:
      run:
        shell: bash
        working-directory: apps/cloudprint_app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Install Linux build dependencies
        if: matrix.dependencies != ''
        run: ${{ matrix.dependencies }}
      - run: flutter pub get
      - run: flutter config --enable-${{ matrix.target }}-desktop
      - run: flutter build ${{ matrix.target }} --release
      - name: Upload desktop application
        uses: actions/upload-artifact@v4
        with:
          name: cloudprint-${{ matrix.target }}-${{ github.sha }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
